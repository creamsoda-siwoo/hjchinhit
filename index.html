<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>볼살 쭈욱!</title>
<style>
  :root {
    --bg: #f3efe8;
    --panel: #ffffff;
    --ink: #2b2420;
    --muted: #8a7f76;
    --accent: #e8655a;
    --good: #3fa66b;
    --gold: #c9a24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  header { width: 100%; max-width: 480px; padding: 14px 16px 4px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .hud {
    width: 100%; max-width: 480px; padding: 8px 16px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .stat { background: var(--panel); border-radius: 12px; padding: 8px 6px; text-align: center; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  .stage { position: relative; width: 100%; max-width: 480px; flex: 1; min-height: 0; padding: 0 16px; }
  svg#game { width: 100%; height: 100%; max-height: 62vh; display: block; touch-action: none; cursor: grab; }
  svg#game.dragging { cursor: grabbing; }
  .gauge { width: 100%; max-width: 480px; padding: 4px 16px 0; }
  .bar { position: relative; height: 14px; border-radius: 7px; background: #e2dbd2; overflow: hidden; }
  .zone { position: absolute; top: 0; bottom: 0; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); opacity: .75; border-radius: 7px; }
  .legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .controls { width: 100%; max-width: 480px; padding: 10px 16px 18px; display: flex; gap: 8px; }
  button {
    flex: 1; border: 0; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: #fff; cursor: pointer; font-family: inherit;
  }
  button.secondary { background: var(--panel); color: var(--ink); flex: 0 0 auto; }
  button:disabled { opacity: .5; }
  .pop {
    position: absolute; pointer-events: none; font-weight: 800; font-size: 22px;
    transform: translate(-50%, -50%); animation: pop 900ms ease-out forwards; white-space: nowrap;
    text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
    20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
  }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(243, 239, 232, .82); text-align: center; padding: 24px;
  }
  .overlay[hidden] { display: none; }
  .overlay .big { font-size: 46px; font-weight: 900; }
  .overlay p { margin: 6px 0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>볼살 쭈욱! 🍡</h1>
  <div class="sub">볼을 잡고 쭈욱 당겼다 놓으세요. 초록 구간에서 놓으면 쫀득 보너스!<br>두 손가락으로 양볼을 같이 당겼다 동시에 놓으면 점수 2배! (마우스는 Shift+드래그)</div>
</header>

<div class="hud">
  <div class="stat"><b id="score">0</b><span>점수</span></div>
  <div class="stat"><b id="combo">x1</b><span>콤보</span></div>
  <div class="stat"><b id="time">30</b><span>남은 시간</span></div>
  <div class="stat"><b id="best">0</b><span>최고 기록</span></div>
</div>

<div class="stage" id="stage">
  <svg id="game" viewBox="0 0 400 480" aria-label="볼살 당기기 게임">
    <!-- jacket -->
    <path d="M40 480 C50 400 110 360 200 360 C290 360 350 400 360 480 Z" fill="#5b3a2a"/>
    <path d="M150 365 L200 480 L250 365 Z" fill="#fbfaf7"/>
    <path d="M140 368 C160 400 180 440 196 480" stroke="#a9b6c6" stroke-width="10" fill="none"/>
    <path d="M260 368 C240 400 220 440 204 480" stroke="#a9b6c6" stroke-width="10" fill="none"/>
    <path d="M140 368 C160 400 180 440 196 480" stroke="#4a2f22" stroke-width="3" fill="none"/>
    <path d="M260 368 C240 400 220 440 204 480" stroke="#4a2f22" stroke-width="3" fill="none"/>
    <circle cx="262" cy="440" r="7" fill="#b9975a"/>
    <!-- neck -->
    <rect x="170" y="330" width="60" height="40" rx="12" fill="#f2c9a5"/>

    <!-- ears -->
    <g id="ears">
      <ellipse id="earL" cx="82" cy="232" rx="20" ry="28" fill="#f2c9a5"/>
      <ellipse id="earR" cx="318" cy="232" rx="20" ry="28" fill="#f2c9a5"/>
    </g>

    <!-- face (deformable) -->
    <path id="face" fill="#f7d4b5" stroke="#e3b48e" stroke-width="2"/>

    <!-- blush -->
    <ellipse id="blushL" cx="130" cy="272" rx="26" ry="14" fill="#f29b8d" opacity=".45"/>
    <ellipse id="blushR" cx="270" cy="272" rx="26" ry="14" fill="#f29b8d" opacity=".45"/>
    <!-- mole near right ear -->
    <circle id="mole" cx="292" cy="246" r="3.2" fill="#3a2a22"/>

    <!-- hair: bowl cut -->
    <path d="M78 214 C66 120 120 62 200 60 C282 62 336 120 322 214
             C312 196 300 186 290 182 L110 182 C100 186 88 196 78 214 Z" fill="#1f1a18"/>
    <path d="M108 184 C120 172 140 168 160 172 C176 166 196 168 214 174 C232 166 256 168 270 176 C282 174 292 178 292 184 Z" fill="#1f1a18"/>
    <path d="M150 90 C170 82 210 80 236 88" stroke="#3b3330" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <g id="eyesOpen">
      <ellipse cx="160" cy="222" rx="7" ry="8" fill="#2b2420"/>
      <ellipse cx="240" cy="222" rx="7" ry="8" fill="#2b2420"/>
      <circle cx="162.5" cy="219" r="2.2" fill="#fff"/>
      <circle cx="242.5" cy="219" r="2.2" fill="#fff"/>
    </g>
    <g id="eyesSquint" visibility="hidden" stroke="#2b2420" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 214 L166 222 L150 230"/>
      <path d="M250 214 L234 222 L250 230"/>
    </g>
    <g id="tears" visibility="hidden" fill="#7cc4f0">
      <path d="M148 236 C144 248 144 256 150 258 C156 256 156 248 152 236 Z"/>
      <path d="M252 236 C248 248 248 256 254 258 C260 256 260 248 256 236 Z"/>
    </g>

    <!-- round gold glasses -->
    <g fill="rgba(220,215,255,.18)" stroke="#c9a24a" stroke-width="3.5">
      <circle cx="160" cy="222" r="30"/>
      <circle cx="240" cy="222" r="30"/>
    </g>
    <path d="M190 218 C195 212 205 212 210 218" stroke="#c9a24a" stroke-width="3" fill="none"/>
    <path d="M130 216 L92 210" stroke="#c9a24a" stroke-width="3"/>
    <path d="M270 216 L308 210" stroke="#c9a24a" stroke-width="3"/>

    <!-- nose -->
    <path d="M196 248 C198 256 204 256 206 250" stroke="#d9a07c" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- mouth (deformable) -->
    <path id="mouth" fill="#c8606a" stroke="#9e4450" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- grab hints -->
    <g id="hints" fill="none" stroke="#e8655a" stroke-width="3" stroke-dasharray="6 6" opacity=".8">
      <circle cx="112" cy="282" r="22"><animate attributeName="r" values="18;24;18" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="288" cy="282" r="22"><animate attributeName="r" values="18;24;18" dur="1.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- pinch fingers -->
    <g id="pinchL" visibility="hidden">
      <ellipse cx="0" cy="-12" rx="13" ry="10" fill="#f0c19c" stroke="#c99470" stroke-width="2"/>
      <ellipse cx="0" cy="12" rx="13" ry="10" fill="#f0c19c" stroke="#c99470" stroke-width="2"/>
    </g>
    <g id="pinchR" visibility="hidden">
      <ellipse cx="0" cy="-12" rx="13" ry="10" fill="#f0c19c" stroke="#c99470" stroke-width="2"/>
      <ellipse cx="0" cy="12" rx="13" ry="10" fill="#f0c19c" stroke="#c99470" stroke-width="2"/>
    </g>

    <!-- speech bubble -->
    <g id="bubble" visibility="hidden">
      <rect id="bubbleBg" x="0" y="0" width="140" height="40" rx="14" fill="#fff" stroke="#2b2420" stroke-width="2"/>
      <text id="bubbleText" x="70" y="26" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2420"></text>
    </g>
  </svg>

  <div class="overlay" id="overlay">
    <div>
      <div class="big" id="ovTitle">볼살 쭈욱!</div>
      <p id="ovText">30초 동안 볼을 최대한 많이, 쫀득하게 당겨 보세요.<br>너무 세게 당기면 아파해요!</p>
    </div>
  </div>
</div>

<div class="gauge">
  <div class="bar" id="bar">
    <div class="zone" style="left:0;width:37.5%;background:#d8cfc4"></div>
    <div class="zone" style="left:37.5%;width:37.5%;background:#9fd8b4"></div>
    <div class="zone" style="left:75%;width:25%;background:#f2a49c"></div>
    <div class="fill" id="fill"></div>
  </div>
  <div class="legend"><span>살짝</span><span>쫀득 구간</span><span>아야!</span></div>
</div>

<div class="controls">
  <button id="start">게임 시작</button>
  <button id="sound" class="secondary" aria-label="소리 켜기/끄기">🔊</button>
</div>

<script>
(() => {
  const svg = document.getElementById('game');
  const face = document.getElementById('face');
  const mouth = document.getElementById('mouth');
  const els = id => document.getElementById(id);
  const blushL = els('blushL'), blushR = els('blushR'), mole = els('mole');
  const earL = els('earL'), earR = els('earR');
  const hints = els('hints');
  const eyesOpen = els('eyesOpen'), eyesSquint = els('eyesSquint'), tears = els('tears');
  const bubble = els('bubble'), bubbleText = els('bubbleText'), bubbleBg = els('bubbleBg');
  const fill = els('fill'), stage = els('stage'), overlay = els('overlay');

  // Face outline: ellipse sampled into points, deformed around the grabbed anchor.
  const CX = 200, CY = 232, RX = 118, RY = 128, N = 72;
  const base = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    // fuller jaw/cheeks: widen lower half slightly
    const lower = Math.max(0, Math.sin(a));
    base.push({ a, x: CX + Math.cos(a) * RX * (1 + 0.06 * lower), y: CY + Math.sin(a) * RY });
  }

  const MAX_PULL = 160;      // gauge full scale (viewBox units)
  const SWEET_MIN = 60, SWEET_MAX = 120;

  // One state per cheek so both can be pulled at once (two fingers, or Shift+drag with a mouse).
  const nearestIdx = (x, y) => base.reduce((bi, b, i) =>
    Math.hypot(b.x - x, b.y - y) < Math.hypot(base[bi].x - x, base[bi].y - y) ? i : bi, 0);
  const cheeks = {
    L: { idx: nearestIdx(112, 282), raw: { x: 0, y: 0 }, vel: { x: 0, y: 0 }, grab: null, pinch: els('pinchL') },
    R: { idx: nearestIdx(288, 282), raw: { x: 0, y: 0 }, vel: { x: 0, y: 0 }, grab: null, pinch: els('pinchR') },
  };
  const mirrorIdx = i => (N / 2 - i + N) % N;
  let mood = 'idle';         // idle | stretch | ouch | happy
  let moodUntil = 0;

  function smoothClosed(pts) {
    // Catmull-Rom -> cubic Bezier
    let d = `M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for (let i = 0; i < pts.length; i++) {
      const p0 = pts[(i - 1 + pts.length) % pts.length], p1 = pts[i];
      const p2 = pts[(i + 1) % pts.length], p3 = pts[(i + 2) % pts.length];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    return d + 'Z';
  }

  function angDist(a, b) {
    let d = Math.abs(a - b) % (Math.PI * 2);
    return d > Math.PI ? Math.PI * 2 - d : d;
  }

  const soft = (x, m) => m * (1 - Math.exp(-x / m));

  // Keep the deformation believable: cheeks stretch outward freely, but can only
  // dent inward a little and slide sideways a limited amount, so the outline never
  // folds over itself (also covers the spring overshooting inward after release).
  function shapePull(raw, idx) {
    const a = base[idx].a;
    let nx = Math.cos(a) / RX, ny = Math.sin(a) / RY;
    const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
    let out = raw.x * nx + raw.y * ny;
    let tx = raw.x - out * nx, ty = raw.y - out * ny;
    if (out < 0) out = -soft(-out, 10);
    const tl = Math.hypot(tx, ty), tMax = 18 + 0.45 * Math.max(out, 0);
    if (tl > 0) {
      const t = soft(tl, tMax);
      tx = tx / tl * t; ty = ty / tl * t;
    }
    return { x: out * nx + tx, y: out * ny + ty };
  }
  const stretchOf = c => { const p = shapePull(c.raw, c.idx); return Math.hypot(p.x, p.y); };

  function render() {
    const pl = shapePull(cheeks.L.raw, cheeks.L.idx);
    const pr = shapePull(cheeks.R.raw, cheeks.R.idx);
    const parts = [[pl, cheeks.L.idx], [pr, cheeks.R.idx]].map(([pull, idx]) =>
      ({ pull, a: base[idx].a, sigma: 0.38 + Math.min(Math.hypot(pull.x, pull.y), 160) / 1400 }));
    const pts = base.map(p => {
      let x = p.x, y = p.y;
      for (const c of parts) {
        const w = Math.exp(-(angDist(p.a, c.a) ** 2) / (2 * c.sigma * c.sigma));
        x += c.pull.x * w; y += c.pull.y * w;
      }
      return { x, y };
    });
    face.setAttribute('d', smoothClosed(pts));

    blushL.setAttribute('transform', `translate(${pl.x * 0.55} ${pl.y * 0.55})`);
    blushR.setAttribute('transform', `translate(${pr.x * 0.55} ${pr.y * 0.55})`);
    mole.setAttribute('transform', `translate(${pr.x * 0.35} ${pr.y * 0.35})`);
    earL.setAttribute('transform', `translate(${pl.x * 0.12} ${pl.y * 0.12})`);
    earR.setAttribute('transform', `translate(${pr.x * 0.12} ${pr.y * 0.12})`);

    // mouth corners follow their cheek, kept below the nose and off the jaw edge
    const mdy = v => Math.max(-10, Math.min(14, v * 0.2));
    const ml = { x: 176 + Math.max(-40, Math.min(8, pl.x * 0.28)), y: 296 + mdy(pl.y) };
    const mr = { x: 224 + Math.max(-8, Math.min(40, pr.x * 0.28)), y: 296 + mdy(pr.y) };
    const stretch = Math.max(Math.hypot(pl.x, pl.y), Math.hypot(pr.x, pr.y));
    const open = mood === 'ouch' ? 18 : mood === 'happy' ? 14 : Math.min(10, 3 + stretch / 20);
    const midX = (ml.x + mr.x) / 2, midY = (ml.y + mr.y) / 2;
    const smile = mood === 'ouch' ? -4 : 6;
    mouth.setAttribute('d',
      `M${ml.x} ${ml.y} Q${midX} ${midY - smile + 2} ${mr.x} ${mr.y} Q${midX} ${midY + open + smile} ${ml.x} ${ml.y} Z`);

    const showSquint = mood === 'ouch' || mood === 'happy' || stretch > SWEET_MIN;
    eyesOpen.setAttribute('visibility', showSquint ? 'hidden' : 'visible');
    eyesSquint.setAttribute('visibility', showSquint ? 'visible' : 'hidden');
    tears.setAttribute('visibility', mood === 'ouch' || stretch > SWEET_MAX ? 'visible' : 'hidden');

    for (const [c, pull] of [[cheeks.L, pl], [cheeks.R, pr]]) {
      c.pinch.setAttribute('visibility', c.grab ? 'visible' : 'hidden');
      if (c.grab) {
        const a = base[c.idx];
        c.pinch.setAttribute('transform', `translate(${a.x + pull.x} ${a.y + pull.y})`);
      }
    }
    fill.style.width = Math.min(100, (stretch / MAX_PULL) * 100) + '%';
    fill.style.background = stretch > SWEET_MAX ? '#c9463b' : stretch >= SWEET_MIN ? '#2f8f57' : '#2b2420';
  }

  function say(text, ms = 900) {
    bubbleText.textContent = text;
    const w = Math.max(90, text.length * 18 + 30);
    bubbleBg.setAttribute('width', w);
    bubbleText.setAttribute('x', w / 2);
    bubble.setAttribute('transform', `translate(${200 - w / 2} 8)`);
    bubble.setAttribute('visibility', 'visible');
    clearTimeout(say.t);
    say.t = setTimeout(() => bubble.setAttribute('visibility', 'hidden'), ms);
  }

  function toSvg(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function popText(text, color, e) {
    const r = stage.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'pop';
    el.textContent = text;
    el.style.color = color;
    el.style.left = (e.clientX - r.left) + 'px';
    el.style.top = (e.clientY - r.top) + 'px';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  // ---------- sound ----------
  let ctx = null, soundOn = true, stretchOsc = null, stretchGain = null;
  function audio() {
    if (!soundOn) return null;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (_) { return null; }
  }
  function boing(pitch = 1) {
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180 * pitch, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(620 * pitch, c.currentTime + 0.08);
    o.frequency.exponentialRampToValueAtTime(240 * pitch, c.currentTime + 0.35);
    g.gain.setValueAtTime(0.25, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.4);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.42);
  }
  function ouchSound() {
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(520, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(160, c.currentTime + 0.3);
    g.gain.setValueAtTime(0.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.32);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.34);
  }
  function startStretch() {
    const c = audio(); if (!c) return;
    stretchOsc = c.createOscillator(); stretchGain = c.createGain();
    stretchOsc.type = 'triangle';
    stretchOsc.frequency.value = 120;
    stretchGain.gain.value = 0.05;
    stretchOsc.connect(stretchGain).connect(c.destination);
    stretchOsc.start();
  }
  function stopStretch() {
    if (stretchOsc) { try { stretchOsc.stop(); } catch (_) {} stretchOsc = null; }
  }

  // ---------- game state ----------
  let playing = false, score = 0, combo = 1, timeLeft = 30, timer = null, best = 0;
  try { best = +localStorage.getItem('cheek-best') || 0; } catch (_) {}
  els('best').textContent = best;

  function updateHud() {
    els('score').textContent = score;
    els('combo').textContent = 'x' + combo;
    els('time').textContent = timeLeft;
  }

  function startGame() {
    score = 0; combo = 1; timeLeft = 30; playing = true;
    overlay.hidden = true;
    els('start').disabled = true;
    updateHud();
    say('살살 해줘…', 1200);
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      updateHud();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    playing = false;
    clearInterval(timer);
    els('start').disabled = false;
    els('start').textContent = '다시 하기';
    let msg = '볼이 얼얼해…';
    if (score > best) {
      best = score;
      try { localStorage.setItem('cheek-best', best); } catch (_) {}
      els('best').textContent = best;
      msg = '신기록! 🎉';
    }
    els('ovTitle').textContent = score + '점';
    els('ovText').innerHTML = msg + '<br>최고 기록: ' + best + '점';
    overlay.hidden = false;
  }

  // ---------- input ----------
  const grabbing = () => !!(cheeks.L.grab || cheeks.R.grab);

  function cheekIdxAt(p, side) {
    // cheek arcs only (angle 0 = right side, PI/2 = chin), never the chin itself
    let bestI = -1, bestD = 1e9;
    base.forEach((b, i) => {
      const onCheek = side === 'R' ? (b.a > 0.12 && b.a < 1.05) : (b.a > Math.PI - 1.05 && b.a < Math.PI - 0.12);
      if (!onCheek) return;
      const d = Math.hypot(b.x - p.x, b.y - p.y);
      if (d < bestD) { bestD = d; bestI = i; }
    });
    return bestI;
  }

  function beginGrab(c, idx, id, start, mirror) {
    c.idx = idx;
    c.grab = { id, start, mirror };
    c.raw = { x: 0, y: 0 }; c.vel = { x: 0, y: 0 };
  }

  svg.addEventListener('pointerdown', e => {
    if (!playing) return;
    const p = toSvg(e);
    const inFace = ((p.x - CX) / RX) ** 2 + ((p.y - CY) / RY) ** 2 < 1.25;
    if (!inFace || Math.abs(p.x - CX) < 45) return;
    const side = p.x < CX ? 'L' : 'R', other = side === 'L' ? 'R' : 'L';
    const c = cheeks[side];
    if (c.grab) return;
    const idx = cheekIdxAt(p, side);
    if (idx < 0) return;
    const wasGrabbing = grabbing();
    beginGrab(c, idx, e.pointerId, { x: p.x, y: p.y }, false);
    // Shift + drag: the other cheek follows as a mirror image (two cheeks with one mouse)
    if (e.shiftKey && !cheeks[other].grab) beginGrab(cheeks[other], mirrorIdx(idx), e.pointerId, { x: p.x, y: p.y }, true);
    mood = 'stretch';
    hints.setAttribute('visibility', 'hidden');
    svg.classList.add('dragging');
    svg.setPointerCapture(e.pointerId);
    if (!wasGrabbing) startStretch();
  });

  svg.addEventListener('pointermove', e => {
    const mine = Object.values(cheeks).filter(c => c.grab && c.grab.id === e.pointerId);
    if (!mine.length) return;
    const p = toSvg(e);
    for (const c of mine) {
      let dx = p.x - c.grab.start.x, dy = p.y - c.grab.start.y;
      if (c.grab.mirror) dx = -dx;
      // rubber-band resistance
      const len = Math.hypot(dx, dy);
      if (len > 0) {
        const eased = 220 * (1 - Math.exp(-len / 180));
        dx = dx / len * eased; dy = dy / len * eased;
      }
      c.raw = { x: dx, y: dy };
    }
    const sL = stretchOf(cheeks.L), sR = stretchOf(cheeks.R), s = Math.max(sL, sR);
    if (stretchOsc) stretchOsc.frequency.value = 120 + s * 3;
    if (s > SWEET_MAX) say('아아아…', 400);
    else if (sL > SWEET_MIN && sR > SWEET_MIN) say('으브브브~', 400);
    else if (s > SWEET_MIN) say('으으음~', 400);
  });

  let lastSweet = { side: null, t: 0 };

  function scoreRelease(side, e) {
    const s = stretchOf(cheeks[side]);
    if (s > SWEET_MAX) {
      combo = 1;
      score = Math.max(0, score - 30);
      mood = 'ouch'; moodUntil = performance.now() + 900;
      say('아야! 너무 세!', 900);
      popText('-30 아야!', '#c9463b', e);
      ouchSound();
    } else if (s >= SWEET_MIN) {
      let pts = Math.round(s) * combo;
      const now = performance.now();
      // both cheeks let go in the sweet zone at (almost) the same time: double points
      const both = lastSweet.side && lastSweet.side !== side && now - lastSweet.t < 300;
      if (both) pts *= 2;
      lastSweet = both ? { side: null, t: 0 } : { side, t: now };
      score += pts;
      combo = Math.min(combo + 1, 9);
      mood = 'happy'; moodUntil = now + 600;
      if (both) say('양볼 쭈욱!!', 900);
      else say(['쫀득!', '말랑~', '찹쌀떡!', '보잉~'][Math.floor(Math.random() * 4)], 700);
      popText('+' + pts + (both ? ' 양볼 보너스!' : ' 쫀득!'), both ? '#d1861b' : '#2f8f57', e);
      boing(1 + combo * 0.05);
    } else if (s > 8) {
      score += Math.round(s / 4);
      combo = 1;
      if (mood !== 'happy' && mood !== 'ouch') mood = 'idle';
      popText('+' + Math.round(s / 4), '#8a7f76', e);
      boing(0.8);
    }
  }

  function release(e) {
    const sides = Object.keys(cheeks).filter(k => cheeks[k].grab && cheeks[k].grab.id === e.pointerId);
    if (!sides.length) return;
    // a mirrored pair is one gesture: count it as a two-cheek release
    if (sides.length === 2) lastSweet = { side: null, t: 0 };
    for (const k of sides) {
      cheeks[k].grab = null;
      cheeks[k].vel = { x: 0, y: 0 };
      if (playing) scoreRelease(k, e);
    }
    if (!grabbing()) {
      stopStretch();
      svg.classList.remove('dragging');
    }
    updateHud();
  }
  svg.addEventListener('pointerup', release);
  svg.addEventListener('pointercancel', release);

  // ---------- spring loop ----------
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    for (const c of Object.values(cheeks)) {
      if (c.grab) continue;
      const k = 260, damp = 9;
      c.vel.x += (-k * c.raw.x - damp * c.vel.x) * dt;
      c.vel.y += (-k * c.raw.y - damp * c.vel.y) * dt;
      c.raw.x += c.vel.x * dt; c.raw.y += c.vel.y * dt;
      if (Math.abs(c.raw.x) < 0.05 && Math.abs(c.vel.x) < 0.05) { c.raw.x = 0; c.vel.x = 0; }
      if (Math.abs(c.raw.y) < 0.05 && Math.abs(c.vel.y) < 0.05) { c.raw.y = 0; c.vel.y = 0; }
    }
    if (!grabbing()) {
      if (mood !== 'idle' && now > moodUntil) mood = 'idle';
      const still = Object.values(cheeks).every(c => c.raw.x === 0 && c.raw.y === 0);
      if (playing && still) hints.setAttribute('visibility', 'visible');
    }
    render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  els('start').addEventListener('click', startGame);
  els('sound').addEventListener('click', () => {
    soundOn = !soundOn;
    els('sound').textContent = soundOn ? '🔊' : '🔇';
  });
})();
</script>
</body>
</html>
